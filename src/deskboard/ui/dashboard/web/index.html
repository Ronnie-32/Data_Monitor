<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeskBoard</title>
  <link rel="stylesheet" href="./css/widgets.css">
</head>
<body data-mode="interaction">
  <div id="edit-dragbar">拖动此区域移动看板；四边和四角可缩放</div>
  <main class="dashboard-surface">
    <header class="shell-bar">
      <h1 class="shell-title">DeskBoard</h1>
      <div id="mode" class="shell-mode">interaction</div>
      <button id="settings" class="settings-button" type="button">打开设置</button>
    </header>
    <section class="widget todo-widget" aria-labelledby="todo-title">
      <header class="widget-header">
        <h2 id="todo-title" class="widget-title">Todo</h2>
        <button id="todo-add" class="todo-add" type="button" aria-label="快速添加待办">+</button>
      </header>
      <form id="todo-add-form" class="todo-add-form">
        <input id="todo-add-input" class="todo-add-input" maxlength="500"
               autocomplete="off" placeholder="输入待办内容，按 Enter 保存" aria-label="待办内容">
      </form>
      <div class="todo-scroll"><ul id="todo-list" class="todo-list"></ul></div>
    </section>
  </main>
  <div id="todo-context-menu" class="todo-context-menu" role="menu">
    <button type="button" data-action="edit">Edit details</button>
    <button type="button" data-action="toggle">Mark incomplete</button>
    <button type="button" data-action="delete">Delete</button>
  </div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script type="module">
    import { createTodoWidget } from "./js/widgets/todo.js";
    new QWebChannel(qt.webChannelTransport, function (channel) {
      const bridge = channel.objects.bridge;
      const todoWidget = createTodoWidget(bridge);
      const applyMode = function (mode) {
        document.body.dataset.mode = mode;
        document.getElementById("mode").textContent = mode;
        todoWidget.setMode();
      };
      bridge.modeChanged.connect(applyMode);
      bridge.todosChanged.connect(todoWidget.render);
      document.getElementById("settings").addEventListener("click", function () {
        bridge.openSettings();
      });
      bridge.notifyReady();
    });
  </script>
</body>
</html>
